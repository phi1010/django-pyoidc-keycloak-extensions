[project]
name = "django-pyoidc-keycloak-extensions"
version = "0.2.1"
description = "Keycloak user/group synchronisation, encrypted token storage and token exchange for django-pyoidc"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["django", "keycloak", "oidc", "sso", "token-exchange"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.2",
    # No upper bound is set here so downstream projects can move at their own pace, but this
    # dependency holds the actual OIDC request paths -- pin it in your project.
    "django-pyoidc>=1.0.13",
    "httpx>=0.27",
    "django-fernet-encrypted-fields>=0.4.0",
    # Used to parse and normalise Admin API URLs before they are requested; httpx brings
    # httpcore rather than urllib3, so it is declared here in its own right.
    "urllib3>=2",
]

[project.optional-dependencies]
celery = ["celery>=5.4"]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "testcontainers>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.0",
]

[project.urls]
Homepage = "https://github.com/phi1010/django-pyoidc-keycloak-extensions"
Source = "https://github.com/phi1010/django-pyoidc-keycloak-extensions"
Issues = "https://github.com/phi1010/django-pyoidc-keycloak-extensions/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_pyoidc_keycloak"]
artifacts = ["src/django_pyoidc_keycloak/templates/**"]

[tool.hatch.build.targets.sdist]
# Tests and the plan are worth shipping; IDE settings are not -- .idea/workspace.xml carries
# local paths and personal state.
include = ["src/", "tests/", "manage.py", "README.md", "PLAN.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "N"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.testproject.settings"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # pyoidc still calls datetime.utcnow(); upstream's problem, not ours.
    "default::DeprecationWarning:oic.*",
    "default::DeprecationWarning:.*oic\\.utils\\.time_util.*",
]
markers = ["integration: needs a real Keycloak container (Podman)"]
# Integration tests are opt-in: run them with `pytest -m integration`.
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.testproject.settings"
