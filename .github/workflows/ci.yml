name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The library targets 3.14; pyproject's requires-python enforces it for consumers.
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra celery

      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: Ruff (format)
        run: uv run ruff format --check src tests

      - name: Django system checks
        run: uv run python manage.py check

      - name: No missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra celery

      - name: Unit tests
        run: uv run pytest -q

  integration:
    # Drives a real Keycloak through Podman. Slower than the unit suite, so it does not gate
    # every push, but it is what catches Admin API behaviour changes between Keycloak versions.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra celery

      - name: Start the Podman API socket
        run: |
          podman --version
          systemctl --user enable --now podman.socket || \
            podman system service --time=0 "unix://${XDG_RUNTIME_DIR}/podman/podman.sock" &
          for _ in $(seq 1 30); do
            [ -S "${XDG_RUNTIME_DIR}/podman/podman.sock" ] && break
            sleep 1
          done
          ls -l "${XDG_RUNTIME_DIR}/podman/podman.sock"

      - name: Pre-pull Keycloak
        run: podman pull quay.io/keycloak/keycloak:26.4

      - name: Integration tests
        run: uv run pytest -m integration -q
